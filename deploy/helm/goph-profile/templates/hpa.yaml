{{- range $component := list "server" "worker" }}
{{- $cfg := index $.Values $component }}
{{- if $cfg.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "goph-profile.fullname" $ }}-{{ $component }}
  labels: {{- include "goph-profile.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "goph-profile.fullname" $ }}-{{ $component }}}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: {{ $cfg.autoscaling.targetMemoryUtilizationPercentage }}}}
---
{{- end }}
{{- end }}
