{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "goph-profile.fullname" . }}
  labels: {{- include "goph-profile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "goph-profile.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports: [{port: {{ .Values.server.port }}, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.monitoringNamespaceLabels | nindent 14 }}
      ports:
        - {port: {{ .Values.server.port }}, protocol: TCP}
        - {port: {{ .Values.worker.metricsPort }}, protocol: TCP}
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{podSelector: {}}]
    {{- range .Values.networkPolicy.egressNamespaceLabels }}
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
    {{- end }}
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
    {{- end }}
{{- end }}
