apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "goph-profile.fullname" . }}-server
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "goph-profile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "goph-profile.fullname" . }}-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "goph-profile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
