apiVersion: v1
kind: Service
metadata:
  name: {{ include "goph-profile.fullname" . }}
  labels: {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "goph-profile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goph-profile.fullname" . }}-worker
  labels: {{- include "goph-profile.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector: {{- include "goph-profile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: {{ .Values.worker.metricsPort }}, targetPort: metrics, protocol: TCP}
