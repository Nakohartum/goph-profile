nameOverride: ""
fullnameOverride: ""

image:
  repository: goph-profile
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

server:
  replicaCount: 2
  port: 8080
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  replicaCount: 2
  metricsPort: 9091
  terminationGracePeriodSeconds: 45
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 750m, memory: 512Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 11m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "40"
  hosts:
    - host: goph-profile.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  logLevel: INFO
  s3Endpoint: minio.default.svc.cluster.local:9000
  s3Bucket: avatars
  s3UseSSL: "false"
  otlpEndpoint: http://jaeger-collector.observability.svc.cluster.local:4318

# Do not commit production credentials. Prefer existingSecret.
secrets:
  existingSecret: ""
  databaseURL: postgresql://goph:change-me@postgres.default.svc.cluster.local:5432/gophprofile?sslmode=disable
  s3AccessKey: minioadmin
  s3SecretKey: change-me
  rabbitmqURL: amqp://goph:change-me@rabbitmq.default.svc.cluster.local:5672/

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels: {}

networkPolicy:
  enabled: true
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
  # Kubernetes policies cannot allow DNS hostnames. Add only the CIDRs used by
  # managed PostgreSQL/S3/RabbitMQ endpoints in each environment.
  egressCIDRs: []
  egressNamespaceLabels:
    - {kubernetes.io/metadata.name: default}
    - {kubernetes.io/metadata.name: observability}

migrations:
  enabled: true
  image:
    repository: goph-profile-migrations
    tag: latest
    pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}
