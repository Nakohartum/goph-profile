global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: goph-profile-server
    static_configs: [{targets: ["server:8080"]}]
  - job_name: goph-profile-worker
    static_configs: [{targets: ["worker:9091"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
